name: Oracle Daily Cycle

on:
  schedule:
    - cron: "0 0 * * *"   # midnight UTC every day
  workflow_dispatch:        # allow manual trigger from GitHub UI

jobs:
  oracle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: agent/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run oracle cycle
        env:
          MANTLE_RPC_URL: ${{ secrets.MANTLE_RPC_URL }}
          ORACLE_PRIVATE_KEY: ${{ secrets.ORACLE_PRIVATE_KEY }}
          ORACLE_MESSAGE_ADDRESS: ${{ secrets.ORACLE_MESSAGE_ADDRESS }}
          TEMPLE_VAULT_ADDRESS: ${{ secrets.TEMPLE_VAULT_ADDRESS }}
          BLESSING_DISTRIBUTOR_ADDRESS: ${{ secrets.BLESSING_DISTRIBUTOR_ADDRESS }}
          USDY_ADDRESS: ${{ secrets.USDY_ADDRESS }}
          CIV_LOG_ADDRESS: ${{ secrets.CIV_LOG_ADDRESS }}
          # Agent routes all 3 AI roles via OpenRouter (code no longer reads GROQ_API_KEY).
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          FULFILLMENT_THRESHOLD: "70"
          # Run once and exit — no cron loop needed in CI
          CRON_SCHEDULE: ""
        run: npx tsx src/index.ts
        timeout-minutes: 10
